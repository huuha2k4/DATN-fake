services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance_network
    restart: always

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - finance_network
    restart: always

  pfm-ai-service:
    build:
      context: ./pfm-ai-service
      dockerfile: Dockerfile
    container_name: pfm-ai-service
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      FINAI_BACKEND_URL: http://backend:8080
      FINAI_SERVICE_SECRET: ${FINAI_SERVICE_SECRET}
      FINAI_INTERNAL_SECRET: ${FINAI_INTERNAL_SECRET}
      FINAI_MODEL_TIMEOUT_SECONDS: ${FINAI_MODEL_TIMEOUT_SECONDS:-10}
      FINAI_REQUEST_BUDGET_SECONDS: ${FINAI_REQUEST_BUDGET_SECONDS:-25}
      FINAI_TOOL_TIMEOUT_SECONDS: ${FINAI_TOOL_TIMEOUT_SECONDS:-8}
      FINAI_MAX_MODEL_ROUNDS: ${FINAI_MAX_MODEL_ROUNDS:-6}
      FINAI_MAX_TOOL_CALLS: ${FINAI_MAX_TOOL_CALLS:-8}
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance_network
    restart: always

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_SERVER}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SUPER_ADMIN_USER: ${SUPER_ADMIN_USER}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      FINAI_SERVICE_URL: http://pfm-ai-service:8000
      FINAI_SERVICE_SECRET: ${FINAI_SERVICE_SECRET}
      FINAI_INTERNAL_SECRET: ${FINAI_INTERNAL_SECRET}
      FINAI_ACTION_TTL_MINUTES: ${FINAI_ACTION_TTL_MINUTES:-15}
      ATTACHMENT_URL_TTL_SECONDS: ${ATTACHMENT_URL_TTL_SECONDS:-300}
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "8080"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pfm-ai-service:
        condition: service_started
    networks:
      - finance_network
    restart: always

  # React Web Frontend
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.prod
    container_name: frontend-web
    environment:
      - VITE_API_URL=${VITE_API_URL}
    expose:
      - "80"
    depends_on:
      - backend
      - pfm-ai-service
    networks:
      - finance_network
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${WEB_PORT:-80}:80"
      # Uncomment for HTTPS
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for HTTPS certificates
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend-web
    networks:
      - finance_network
    restart: always

volumes:
  postgres_data:
  redis_data:
  upload_data:

networks:
  finance_network:
    driver: bridge

spring:
  application:
    name: finance-management
  
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        default_schema: core
        jakarta:
          persistence:
            validation:
              mode: none
    open-in-view: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: core
    create-schemas: true
    # Giữ false để tương thích DB hiện có từng chỉnh sửa V11/V36/V51/V57/V58/V59; vẫn bật ddl-auto=validate
    validate-on-migrate: false
  
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:}
            client-secret: ${FACEBOOK_CLIENT_SECRET:}
            scope:
              - email
              - public_profile

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,conditions
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true
    mail:
      enabled: false  # Disable mail health check

logging:
  level:
    root: INFO
    com.finance.finance: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    # DEBUG logs resolved request/response DTO values, including auth credentials.
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [req=%X{requestId:-} corr=%X{correlationId:-}] %logger{36} - %msg%n"

app:
  name: ${APP_NAME:Finance Management}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5713}
  
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-environment-must-be-at-least-256-bits}
    access-token-expiration: 86400000       # 24 hours (in ms) để trải nghiệm app và dev mượt mà không bị hết hạn liên tục
    refresh-token-expiration: 2592000000   # 30 days (in ms)
    issuer: finance-app
  
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5713,http://localhost:1116}
    max-login-attempts: 5
    lockout-duration-minutes: 15
  
  admin:
    username: ${SUPER_ADMIN_USER:admin}
    email: ${SUPER_ADMIN_EMAIL:admin@finance.com}
    password: ${SUPER_ADMIN_PASSWORD:admin123}

  ai:
    ocr-service-url: ${OCR_SERVICE_URL:http://ocr-service:8000}

  finai:
    service-url: ${FINAI_SERVICE_URL:http://pfm-ai-service:8000}
    service-secret: ${FINAI_SERVICE_SECRET:dev-only-finai-service-secret-change-me}
    internal-secret: ${FINAI_INTERNAL_SECRET:dev-only-finai-internal-secret-change-me}
    action-ttl-minutes: ${FINAI_ACTION_TTL_MINUTES:15}

  attachments:
    url-ttl-seconds: ${ATTACHMENT_URL_TTL_SECONDS:300}

  audit:
    hmac-secret: ${AUDIT_HMAC_SECRET:${JWT_SECRET:dev-only-audit-hmac-secret-change-me}}
    viewer:
      password: ${SYSTEM_AUDIT_VIEW_PASSWORD:}
      token-ttl-seconds: ${SYSTEM_AUDIT_TOKEN_TTL_SECONDS:600}
    retention:
      enabled: ${AUDIT_RETENTION_ENABLED:false}
      dry-run: ${AUDIT_RETENTION_DRY_RUN:true}
      operational-days: ${AUDIT_RETENTION_OPERATIONAL_DAYS:90}
      security-days: ${AUDIT_RETENTION_SECURITY_DAYS:365}
      financial-days: ${AUDIT_RETENTION_FINANCIAL_DAYS:365}
      batch-size: ${AUDIT_RETENTION_BATCH_SIZE:500}

  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      ios-client-id: ${GOOGLE_IOS_CLIENT_ID:}
      android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

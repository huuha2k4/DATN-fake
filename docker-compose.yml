services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    # Port chỉ dùng internal, không expose ra ngoài
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance_network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    # Port chỉ dùng internal, không expose ra ngoài
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - finance_network
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_SERVER}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SUPER_ADMIN_USER: ${SUPER_ADMIN_USER}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    # Port chỉ dùng internal, không expose ra ngoài
    expose:
      - "8080"
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - maven_cache:/root/.m2
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finance_network
    restart: unless-stopped

  # React Web Frontend (Admin Dashboard)
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.dev
    container_name: frontend-web
    environment:
      - VITE_API_URL=${VITE_API_URL}
    # Port chỉ dùng internal, không expose ra ngoài
    expose:
      - "5173"
    volumes:
      - ./frontend-web/src:/app/src
      - ./frontend-web/public:/app/public
      - ./frontend-web/index.html:/app/index.html
      - ./frontend-web/vite.config.ts:/app/vite.config.ts
      - ./frontend-web/tsconfig.json:/app/tsconfig.json
      - ./frontend-web/package.json:/app/package.json
      - ./frontend-web/package-lock.json:/app/package-lock.json
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - finance_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-web
    networks:
      - finance_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  maven_cache:
  frontend_node_modules:
  upload_data:

networks:
  finance_network:
    driver: bridge
